# Read the Docs configuration file.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

sphinx:
  configuration: docs/conf.py

python:
  install:
    # Pinned lockfile (compiled from the `docs` extra) for reproducible builds;
    # regenerate with: uv pip compile --extra docs -o docs/requirements.txt pyproject.toml
    - requirements: docs/requirements.txt
    # Install the package itself so autodoc can import linguistica.
    - method: pip
      path: .
