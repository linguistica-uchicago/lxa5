name: Python

on:
  push:
  pull_request:

env:
  PYTHON_VERSION: "3.14"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Check formatting with black
        run: uvx black --check src tests

      - name: Lint with flake8
        run: uvx flake8 src tests

      - name: Install package
        run: |
          uv venv
          uv pip install .[dev]

      - name: Type-check with mypy
        run: uv run mypy src/linguistica

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package
        run: |
          uv venv
          uv pip install .[dev]

      - name: Run tests
        run: uv run pytest -vv --cov linguistica tests

  gui:
    name: GUI smoke test
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_DISABLE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install system libraries for QtWebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 \
            libgbm1 libasound2t64 libegl1 libxtst6 libxshmfence1

      - name: Install package with GUI extra
        run: |
          uv venv
          uv pip install .[dev,gui]

      - name: Run GUI smoke test
        run: uv run pytest -vv tests/test_gui.py

  build:
    name: Build (release readiness check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Build sdist and wheel
        run: uvx --from build pyproject-build --installer uv

      - name: Check with twine
        run: uvx twine check dist/*
